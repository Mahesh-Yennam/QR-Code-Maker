<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="qrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top-Left Finder Pattern -->
  <rect x="12" y="12" width="16" height="16" rx="4" fill="none" stroke="url(#qrGrad)" stroke-width="3" filter="url(#qrGlow)" />
  <rect x="17" y="17" width="6" height="6" rx="1.5" fill="#38bdf8" />

  <!-- Top-Right Finder Pattern -->
  <rect x="36" y="12" width="16" height="16" rx="4" fill="none" stroke="url(#qrGrad)" stroke-width="3" filter="url(#qrGlow)" />
  <rect x="41" y="17" width="6" height="6" rx="1.5" fill="#38bdf8" />

  <!-- Bottom-Left Finder Pattern -->
  <rect x="12" y="36" width="16" height="16" rx="4" fill="none" stroke="url(#qrGrad)" stroke-width="3" filter="url(#qrGlow)" />
  <rect x="17" y="41" width="6" height="6" rx="1.5" fill="#38bdf8" />

  <!-- QR Data Modules (Dots & Tracks) -->
  <rect x="32" y="14" width="3" height="3" rx="0.8" fill="#38bdf8" />
  <rect x="32" y="24" width="3" height="3" rx="0.8" fill="#8b5cf6" />
  <rect x="14" y="31" width="3" height="3" rx="0.8" fill="#38bdf8" />
  <rect x="24" y="31" width="3" height="3" rx="0.8" fill="#8b5cf6" />
  
  <rect x="36" y="36" width="4" height="4" rx="1" fill="#38bdf8" />
  <rect x="44" y="36" width="4" height="4" rx="1" fill="#8b5cf6" />
  <rect x="36" y="44" width="4" height="4" rx="1" fill="#8b5cf6" />
  <rect x="48" y="44" width="4" height="4" rx="1" fill="#38bdf8" />
  <rect x="40" y="48" width="4" height="4" rx="1" fill="#38bdf8" />
  <rect x="48" y="40" width="4" height="4" rx="1" fill="#8b5cf6" />
</svg>
